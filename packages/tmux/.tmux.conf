# set prefixes to Ctrl-a and Ctrl-Space
unbind C-b
set-option -g prefix C-a
set-option -g prefix2 C-Space
bind-key C-a send-prefix
bind-key C-Space send-prefix -2

set -g base-index 1
setw -g pane-base-index 1

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -sg escape-time 10
set -g focus-events on
set -g history-limit 100000
set -g detach-on-destroy off
set -s set-clipboard on
set -g allow-passthrough on

# reload conf with prefix R
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# vi copypaste mode (yank handled by tmux-yank + OSC 52)
set-window-option -g mode-keys vi

# panes
bind v split-window -h
bind - split-window -v
bind s choose-tree -Zs

## Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

## resize with Ctrl-Alt-Arrow
bind-key -n C-M-Up resize-pane -U
bind-key -n C-M-Down resize-pane -D
bind-key -n C-M-Left resize-pane -L
bind-key -n C-M-Right resize-pane -R

# windows

## Enable automatic renaming
set-option -g automatic-rename on

## Tell tmux to use the current command as the name
set-option -g automatic-rename-format "#{pane_current_command}"

## Shift arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

set-option -g allow-rename on

# enable mouse mode
set -g mouse on

# session + host so local and remote servers are distinguishable
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "[#S] "
set -g status-right "#H %H:%M "

# TPM (clone + install_plugins also run from script/install-tmux-plugins.sh)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
if "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
