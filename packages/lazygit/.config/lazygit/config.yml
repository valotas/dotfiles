keybinding:
  universal:
    # Ghostty turns Cmd+Enter and Ctrl+Enter into this legacy Alt+Enter sequence
    # so lazygit 0.47 can confirm. 0.47 accepts only a string here, not a list.
    confirmInEditor: <a-enter>
    # Ignored by 0.47. Newer lazygit also confirms on Ctrl+S.
    confirmInEditor-alt: <c-s>
