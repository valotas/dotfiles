[ids]
*

[main]
# Caps Lock:
#   hold       = vim navigation
#   tap        = compose (after the double-tap window)
#   double tap = escape
capslock = overload(vimnav, timeout(oneshot(cap2esc), 200, compose))

# Both Shift keys together toggle Caps Lock. A lone Shift stays Shift.
# This uses keyd's built-in shift layer, which only remaps the other Shift.
[shift]
leftshift = capslock
rightshift = capslock

[vimnav]
h = left
j = down
k = up
l = right
space = backspace

# Armed by the first tap. The second tap within 200ms sends Escape.
[cap2esc]
capslock = esc
